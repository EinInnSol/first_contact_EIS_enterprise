# Cloud Build configuration for frontend dashboard
# Optimized for Next.js deployment on Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/firstcontact-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/firstcontact-web:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/firstcontact-web:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/firstcontact-web:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'firstcontact-web'
      - '--image=gcr.io/$PROJECT_ID/firstcontact-web:$COMMIT_SHA'
      - '--region=us-east5'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=60'
      - '--max-instances=10'
      - '--min-instances=0'

images:
  - 'gcr.io/$PROJECT_ID/firstcontact-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/firstcontact-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

timeout: '1200s'

substitutions:
  _API_URL: 'https://firstcontact-api-XXXXXXXXX.run.app'
