# Cloud Build configuration for First Contact E.I.S.
# Builds and deploys to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/first-contact-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/first-contact-api:latest'
      - '.'
    dir: 'backend'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/first-contact-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/first-contact-api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'first-contact-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/first-contact-api:$COMMIT_SHA'
      - '--region'
      - 'us-east5'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${PROJECT_ID}:us-east5:first-contact-db'
      - '--set-env-vars'
      - 'DB_HOST=/cloudsql/${PROJECT_ID}:us-east5:first-contact-db,DB_NAME=firstcontact,DB_USER=firstcontact_app,ENVIRONMENT=production'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'

# Build images for caching
images:
  - 'gcr.io/$PROJECT_ID/first-contact-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/first-contact-api:latest'

# Timeout
timeout: '1200s'
