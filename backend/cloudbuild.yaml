# Cloud Build configuration for backend API
# Optimized for Cloud Run deployment with Secret Manager integration

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/firstcontact-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/firstcontact-api:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/firstcontact-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/firstcontact-api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'firstcontact-api'
      - '--image=gcr.io/$PROJECT_ID/firstcontact-api:$COMMIT_SHA'
      - '--region=us-east5'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--set-env-vars=ENVIRONMENT=production,DEBUG=false'
      - '--set-secrets=DATABASE_URL=firstcontact-db-url:latest,JWT_SECRET=firstcontact-jwt-secret:latest,ANTHROPIC_API_KEY=firstcontact-anthropic-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/firstcontact-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/firstcontact-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'

timeout: '1200s'
